name: Fix bookshelf tag bar line
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix bookshelf tag bar line'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch tag bar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt')
          s=p.read_text()
          old='''                setColor(glassSurface)\n                setStroke(1.dpToPx(), glassStroke)\n            }\n            addView('''
          new='''                setColor(glassSurface)\n            }\n            addView('''
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt
          git commit -m 'Fix bookshelf tag bar line'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-tagbar-line.yml
          git add .github/workflows/fix-tagbar-line.yml
          git commit -m 'Remove temporary tag bar workflow'
          git push