name: Fix bookshelf tag white line

on: [push]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch tag scroll container
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt'); s=p.read_text(); old='isHorizontalScrollBarEnabled = false'; new='isHorizontalScrollBarEnabled = false\\n            isVerticalScrollBarEnabled = false\\n            isHorizontalFadingEdgeEnabled = false\\n            setFadingEdgeLength(0)\\n            overScrollMode = View.OVER_SCROLL_NEVER'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt
          git rm .github/workflows/fix-tag-white-line.yml
          git commit -m 'Fix bookshelf tag bar white line'
          git push