name: Fix bookshelf tag white line

on:
  push:
    paths:
      - '.github/workflows/fix-tag-white-line.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch tag scroll container
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt')
          s = p.read_text()
          old = '''            isHorizontalScrollBarEnabled = false
            isFillViewport = false
            clipToPadding = true'''
          new = '''            isHorizontalScrollBarEnabled = false
            isVerticalScrollBarEnabled = false
            isHorizontalFadingEdgeEnabled = false
            setFadingEdgeLength(0)
            overScrollMode = View.OVER_SCROLL_NEVER
            isFillViewport = false
            clipToPadding = true'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt
          git rm .github/workflows/fix-tag-white-line.yml
          git commit -m 'Fix bookshelf tag bar white line'
          git push