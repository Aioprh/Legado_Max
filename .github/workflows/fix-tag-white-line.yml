name: Fix bookshelf tag white line

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch tag scroll container
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt')
          s = p.read_text()
          pattern = r'(?m)^(\s*)isHorizontalScrollBarEnabled = false$'
          replacement = r'''\1isHorizontalScrollBarEnabled = false
\1isVerticalScrollBarEnabled = false
\1isHorizontalFadingEdgeEnabled = false
\1setFadingEdgeLength(0)
\1overScrollMode = View.OVER_SCROLL_NEVER'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('horizontal scroll container target not found')
          p.write_text(s2)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt
          git rm .github/workflows/fix-tag-white-line.yml
          git commit -m 'Fix bookshelf tag bar white line'
          git push