name: Quick Lint and Compile

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

# 确保在同一个分支上连续 push 时，取消之前的旧任务，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Compile Check
        run: |
          chmod +x gradlew
          # 只执行编译源码任务，不打包，最快速度验证 Kotlin 语法和依赖情况
          ./gradlew compileDebugSources --parallel --daemon --warning-mode all