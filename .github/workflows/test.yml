name: Test Build

on:
  push:
    branches:
      - main
    paths:
      - '**'
      # - '!**/assets/**'
      # - '!**.md'
      - '!**/ISSUE_TEMPLATE/**'
      - '!**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_run:
    workflows: [Build Web]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      versionL: ${{ steps.set-ver.outputs.versionL }}
      updateLog_updated: ${{ steps.updateLog.outputs.updated }}
      updateLog_content: ${{ steps.updateLog.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT
          echo "versionL=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT
      - id: updateLog
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --unshallow --depth=20 origin main 2>/dev/null || git fetch --depth=20 origin main 2>/dev/null || true
          UPDATED_CONTENT=""
          IS_MERGE_PR=false
          if [[ -n "$COMMIT_MSG" ]]; then
            if [[ "$COMMIT_MSG" =~ ^"Merge pull request" ]] ||
              [[ "$COMMIT_MSG" =~ ^"Merge branch" ]] ||
              [[ "$COMMIT_MSG" =~ ^"Sync upstream" ]]; then
              IS_MERGE_PR=true
            fi
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null)
          UPDATE_LOG_CHANGED=$(echo "$CHANGED_FILES" | grep -q "app/src/main/assets/updateLog.md" && echo "yes" || echo "no")
          CRONET_JSON_CHANGED=$(echo "$CHANGED_FILES" | grep -q "app/src/main/assets/cronet.json" && echo "yes" || echo "no")

          if [ "$UPDATE_LOG_CHANGED" = "yes" ] && [ "$CRONET_JSON_CHANGED" = "no" ]; then
            echo "updated=yes" >> $GITHUB_OUTPUT
            if [ -f "app/src/main/assets/updateLog.md" ]; then
              UPDATED_CONTENT=$(awk '
              /^\*\*20/ && !found {
                found=1
              }
              found {
                if (NF == 0) exit
                print
              }
              ' app/src/main/assets/updateLog.md)
              if [ -z "$UPDATED_CONTENT" ]; then
                UPDATED_CONTENT=$(head -n 10 app/src/main/assets/updateLog.md)
              fi
            fi
          elif [ "$IS_MERGE_PR" = true ]; then
            UPDATED_CONTENT="$COMMIT_MSG"
          else
            if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BEFORE_SHA="${{ github.event.before }}"
              AFTER_SHA="${{ github.event.after }}"
              COMMIT_RANGE="$BEFORE_SHA..$AFTER_SHA"
              if git rev-parse "$COMMIT_RANGE" >/dev/null 2>&1; then
                UPDATED_CONTENT=$(git log $COMMIT_RANGE --pretty=format:"* %s" --reverse 2>/dev/null | grep -v "^* Merge" || echo "* $COMMIT_MSG")
              else
                UPDATED_CONTENT=$(git log -10 --pretty=format:"* %s (%h)" --reverse 2>/dev/null | grep -v "^* Merge")
              fi
            fi
          fi

          if [ -z "$UPDATED_CONTENT" ]; then
            UPDATED_CONTENT=$(git log -1 --pretty=%B)
          fi

          if [[ "$UPDATED_CONTENT" =~ ^"Bump web" ]]; then
            PREVIOUS_COMMIT_BODY=$(git log --skip=1 -1 --pretty=%B)
            UPDATED_CONTENT=$(printf "* %s\n* %s" "$UPDATED_CONTENT" "$PREVIOUS_COMMIT_BODY")
          fi

          CONTENT_JSON=$(echo "$UPDATED_CONTENT" | jq -Rs . 2>/dev/null || echo "\"Error generating update content\"")
          echo "body=$CONTENT_JSON" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSIONL: ${{ needs.prepare.outputs.versionL }}
      UPDATE_UPDATED: ${{ needs.prepare.outputs.updateLog_updated }}
      UPDATE_BODY: ${{ fromJSON(needs.prepare.outputs.updateLog_content) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "">$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Release Apk Sign
        run: |
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          cat >> $GITHUB_WORKSPACE/gradle.properties << EOF
          RELEASE_STORE_FILE=./legado.jks
          RELEASE_KEY_ALIAS=legado
          RELEASE_STORE_PASSWORD=gedoor_legado
          RELEASE_KEY_PASSWORD=gedoor_legado
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build And Rename
        run: |
          echo "统一版本号"
          sed "/def version/c def version = \"$VERSION\"" $GITHUB_WORKSPACE/app/build.gradle -i
          chmod +x gradlew
          mkdir -p ${{ github.workspace }}/apk/

          build_one () {
            local task="$1"; local rename="$2"
            echo "开始构建：$task"
            ./gradlew "$task" --build-cache --parallel --daemon --warning-mode all
            echo "修改APK文件名"
            for file in `ls ${{ github.workspace }}/app/build/outputs/apk/*/*/*.apk`; do
              mv "$file" ${{ github.workspace }}/apk/"$rename"
            done
          }

          build_one "assembleAppMaxRelease"    "legado_测试版_${VERSIONL}_原包名.apk"
          build_one "assembleAppSRelease"      "legado_正式版_${VERSIONL}_共存.apk"
          build_one "assembleAppLegacyRelease" "legado_兼容版_${VERSIONL}_旧版覆盖.apk"
          build_one "assembleAppMaxDebug"      "legado_Debug调试包_${VERSIONL}.apk"

      - name: Check Build production
        run: |
          if [ ! -d ${{ github.workspace }}/apk ]; then
            echo "Build production not found! Check gradle logs."
            exit 1
          fi
          cd ${{ github.workspace }}/apk/
          if [ ! -e legado_*.apk ]; then
            echo "Build production not found! Check gradle logs."
            exit 1
          fi

      - name: 计算发布信息
        run: |
          if [ "$UPDATE_UPDATED" = "yes" ]; then
            echo "RELEASE_TAG=$VERSION" >> $GITHUB_ENV
            echo "RELEASE_NAME=legado_app_$VERSION" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
            printf '⚠️ **每次安装前请备份！**\n\n### 更新内容\n\n%s\n' "$UPDATE_BODY" > /tmp/release_body.md
          else
            echo "RELEASE_TAG=beta-$VERSIONL" >> $GITHUB_ENV
            echo "RELEASE_NAME=legado_app_$VERSIONL" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
            printf '⚠️ **重要提醒：安装前请务必备份您的数据！**\n\n📦 **APK版本说明：**\n| 版本类型 | 文件标识 | 说明 |\n|---------|---------|------|\n| 测试版 | 原包名 | 测试版，专属于max版的安装包 |\n| 兼容版 | 旧版覆盖 | 可覆盖原版和lyc版 |\n| 共存版 | 共存 | 独立安装，与主版本共存 |\n| 调试包 | debug | 独立安装，无代码混淆，方便定位问题 |\n\n### 更新内容\n\n%s\n' "$UPDATE_BODY" > /tmp/release_body.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release_body.md
          prerelease: ${{ env.PRERELEASE }}
          files: ${{ github.workspace }}/apk/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}