name: Apply WebView audio mini bar safe area fix
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'Aioprh' && !contains(github.event.head_commit.message, '[webview-safe-area]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path

          web = Path('app/src/main/java/io/legado/app/ui/browser/WebViewActivity.kt')
          text = web.read_text(encoding='utf-8')

          import_marker = 'import android.webkit.URLUtil\n'
          if 'WebViewAudioSafeAreaController' not in text:
              text = text.replace(import_marker, import_marker + 'import io.legado.app.ui.widget.WebViewAudioSafeAreaController\n', 1)

          field_marker = '    private lateinit var currentWebView: WebView\n'
          if 'webViewAudioSafeAreaController' not in text:
              text = text.replace(field_marker, field_marker + '    private var webViewAudioSafeAreaController: WebViewAudioSafeAreaController? = null\n', 1)

          init_marker = '        currentWebView = pooledWebView.realWebView\n'
          if 'webViewAudioSafeAreaController = WebViewAudioSafeAreaController' not in text:
              text = text.replace(init_marker, init_marker + '        webViewAudioSafeAreaController = WebViewAudioSafeAreaController(this, currentWebView)\n', 1)

          page_finished_marker = '        override fun onPageFinished(view: WebView?, url: String?) {\n            super.onPageFinished(view, url)\n'
          if 'webViewAudioSafeAreaController?.refresh()' not in text:
              text = text.replace(page_finished_marker, page_finished_marker + '            webViewAudioSafeAreaController?.refresh()\n', 1)

          destroy_marker = '    override fun onDestroy() {\n        WebViewPool.release(pooledWebView)\n'
          if 'webViewAudioSafeAreaController?.destroy()' not in text:
              text = text.replace(destroy_marker, '    override fun onDestroy() {\n        webViewAudioSafeAreaController?.destroy()\n        webViewAudioSafeAreaController = null\n        WebViewPool.release(pooledWebView)\n', 1)

          web.write_text(text, encoding='utf-8')

          helper = Path('app/src/main/java/io/legado/app/ui/widget/WebViewAudioSafeAreaController.kt')
          helper.write_text(r'''package io.legado.app.ui.widget

import android.webkit.JavascriptInterface
import android.webkit.WebView
import android.view.View
import android.view.ViewGroup
import androidx.appcompat.app.AppCompatActivity
import androidx.core.view.ViewCompat
import androidx.core.view.WindowInsetsCompat
import io.legado.app.R
import io.legado.app.utils.dpToPx
import java.lang.ref.WeakReference
import kotlin.math.max

/**
 * Keeps the audio mini player above bottom UI rendered inside a WebView.
 * Native/system insets and visible fixed/sticky bottom controls are combined
 * into one adaptive safe bottom offset.
 */
class WebViewAudioSafeAreaController(
    activity: AppCompatActivity,
    private val webView: WebView
) {
    private val activityRef = WeakReference(activity)
    private var destroyed = false
    private var bridgeInstalled = false
    private var lastWebObstructionPx = 0f

    private val bridge = object {
        @JavascriptInterface
        fun reportBottomObstruction(px: Float) {
            val activity = activityRef.get() ?: return
            if (destroyed) return
            activity.runOnUiThread {
                if (!destroyed) applyWebObstruction(px)
            }
        }
    }

    init {
        if (!bridgeInstalled) {
            webView.addJavascriptInterface(bridge, BRIDGE_NAME)
            bridgeInstalled = true
        }
        webView.addOnLayoutChangeListener { _, _, _, _, _, _, _, _, _ ->
            if (!destroyed) webView.post { refresh() }
        }
        ViewCompat.setOnApplyWindowInsetsListenerCompat(webView) { _, insets ->
            applyWebObstruction(lastWebObstructionPx)
            insets
        }
        refresh()
    }

    fun refresh() {
        if (destroyed || !webView.isAttachedToWindow) return
        val script = """
            (function(){
              try {
                var dpr = window.devicePixelRatio || 1;
                var vh = window.innerHeight || document.documentElement.clientHeight || 0;
                var vw = window.innerWidth || document.documentElement.clientWidth || 0;
                var maxH = 0;
                var els = document.querySelectorAll('*');
                for (var i = 0; i < els.length; i++) {
                  var e = els[i], s = window.getComputedStyle(e);
                  if (s.display === 'none' || s.visibility === 'hidden' || parseFloat(s.opacity || '1') < 0.05) continue;
                  if (s.position !== 'fixed' && s.position !== 'sticky') continue;
                  var r = e.getBoundingClientRect();
                  if (r.width < vw * 0.5 || r.height < 40 || r.height > vh * 0.35) continue;
                  if (r.bottom < vh - 16 || r.top > vh || r.bottom <= r.top) continue;
                  var z = parseInt(s.zIndex || '0', 10);
                  if (!isNaN(z) && z < 0) continue;
                  maxH = Math.max(maxH, Math.min(vh, vh - Math.max(0, r.top)));
                }
                if (window.LegadoAudioSafeArea) window.LegadoAudioSafeArea.reportBottomObstruction(Math.round(maxH * dpr));
              } catch(e) {}
            })();
        """.trimIndent()
        webView.evaluateJavascript(script, null)
        installObserver()
    }

    private fun installObserver() {
        webView.evaluateJavascript("""
            (function(){
              if(window.__legadoAudioSafeAreaInstalled) return;
              window.__legadoAudioSafeAreaInstalled=true;
              function report(){
                try {
                  var dpr=window.devicePixelRatio||1, vh=window.innerHeight||document.documentElement.clientHeight||0, vw=window.innerWidth||document.documentElement.clientWidth||0, maxH=0;
                  document.querySelectorAll('*').forEach(function(e){
                    var s=getComputedStyle(e);
                    if(s.display==='none'||s.visibility==='hidden'||parseFloat(s.opacity||'1')<0.05) return;
                    if(s.position!=='fixed'&&s.position!=='sticky') return;
                    var r=e.getBoundingClientRect();
                    if(r.width<vw*0.5||r.height<40||r.height>vh*0.35) return;
                    if(r.bottom<vh-16||r.top>vh||r.bottom<=r.top) return;
                    var z=parseInt(s.zIndex||'0',10); if(!isNaN(z)&&z<0) return;
                    maxH=Math.max(maxH,Math.min(vh,vh-Math.max(0,r.top)));
                  });
                  if(window.LegadoAudioSafeArea) window.LegadoAudioSafeArea.reportBottomObstruction(Math.round(maxH*dpr));
                } catch(e) {}
              }
              window.LegadoAudioSafeArea.__report=report;
              var observer=new MutationObserver(function(){
                clearTimeout(window.__legadoAudioSafeAreaTimer);
                window.__legadoAudioSafeAreaTimer=setTimeout(report,80);
              });
              observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});
              window.addEventListener('resize',report,{passive:true});
              window.addEventListener('orientationchange',report,{passive:true});
              report();
            })();
        """.trimIndent(), null)
    }

    private fun applyWebObstruction(px: Float) {
        lastWebObstructionPx = px.coerceAtLeast(0f)
        val activity = activityRef.get() ?: return
        val miniBar = activity.findViewById<View>(R.id.audio_play_mini_bar) ?: return
        if (!miniBar.isShown) return
        val systemBottom = ViewCompat.getRootWindowInsets(activity.window.decorView)
            ?.getInsets(WindowInsetsCompat.Type.navigationBars())?.bottom ?: 0
        val safeBottom = max(systemBottom, lastWebObstructionPx.toInt()) + 10.dpToPx()
        miniBar.updateBottomMargin(safeBottom)
    }

    fun destroy() {
        destroyed = true
        val activity = activityRef.get()
        val miniBar = activity?.findViewById<View>(R.id.audio_play_mini_bar)
        miniBar?.let {
            val lp = it.layoutParams as? ViewGroup.MarginLayoutParams ?: return@let
            lp.bottomMargin = 18.dpToPx()
            it.layoutParams = lp
        }
    }

    private fun View.updateBottomMargin(margin: Int) {
        val lp = layoutParams as? ViewGroup.MarginLayoutParams ?: return
        if (lp.bottomMargin == margin) return
        lp.bottomMargin = margin
        layoutParams = lp
    }

    private companion object {
        const val BRIDGE_NAME = "LegadoAudioSafeArea"
    }
}
''', encoding='utf-8')

      - name: Verify patch
        run: |
          grep -q 'WebViewAudioSafeAreaController' app/src/main/java/io/legado/app/ui/browser/WebViewActivity.kt
          test -f app/src/main/java/io/legado/app/ui/widget/WebViewAudioSafeAreaController.kt
          ./gradlew :app:compileMaxDebugKotlin --no-daemon

      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/browser/WebViewActivity.kt app/src/main/java/io/legado/app/ui/widget/WebViewAudioSafeAreaController.kt
          git rm -f .github/workflows/apply-webview-audio-safe-area.yml
          git commit -m 'fix: WebView audio mini bar adaptive safe area [webview-safe-area]'
          git push
