name: Fix bookshelf tag capsule clipping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix bookshelf tag capsule clipping'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt')
          s = p.read_text(encoding='utf-8')
          indent = ' ' * 12
          old = indent + 'clipToPadding = false'
          replacement = indent + '''clipToPadding = true
          ''' + indent + '''clipChildren = true
          ''' + indent + '''clipToOutline = true
          ''' + indent + '''outlineProvider = object : android.view.ViewOutlineProvider() {
          ''' + indent + '''    override fun getOutline(view: View, outline: android.graphics.Outline) {
          ''' + indent + '''        outline.setRoundRect(
          ''' + indent + '''            0,
          ''' + indent + '''            0,
          ''' + indent + '''            view.width,
          ''' + indent + '''            view.height,
          ''' + indent + '''            22.dpToPx().toFloat()
          ''' + indent + '''        )
          ''' + indent + '''    }
          ''' + indent + '''}'''
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, replacement, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/main-tag-clip-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/main/bookshelf/style1/books/BooksFragment.kt .github/workflows/main-tag-clip-fix.yml
          git commit -m 'Fix bookshelf tag capsule clipping'
          git push origin HEAD:main
