      async function loadHome(site, force = false) {
        state.homeSite = Number(site);
        document.querySelectorAll('[data-home-site]').forEach((button) => {
          button.classList.toggle('active', Number(button.dataset.homeSite) === state.homeSite);
        });
        $('homeTitle').textContent = state.homeSite === 12 ? '女生书城' : '男生书城';
        if (!force && state.homeCache.has(state.homeSite)) {
          renderHome(state.homeCache.get(state.homeSite));
          return;
        }
        $('homeMeta').textContent = '正在加载';
        $('homeModules').innerHTML = '<div class="home-state"><div><div class="spinner"></div>正在加载书城</div></div>';
        try {
          const response = await fetch(`${api}?action=square&site=${state.homeSite}&page=1&page_size=20`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '书城加载失败');
          const data = payload.Data || {};
          const modules = extractHomeModules(data.Items || []);
          const result = { pageName: data.PageName || (state.homeSite === 12 ? '女生' : '男生'), modules };
          state.homeCache.set(state.homeSite, result);
          renderHome(result);
          setConnection(true, '接口正常');
        } catch (error) {
          $('homeMeta').textContent = '未获取到数据';
          $('homeModules').innerHTML = `<div class="home-state error">${escapeHtml(error.message)}</div>`;
          setConnection(false, '请求失败');
        }
      }

      function extractHomeModules(root) {
        const found = new Map();
        const visit = (node) => {
          if (!node || typeof node !== 'object') return;
          const title = node.Title?.Name;
          if (title) {
            const books = [];
            collectHomeBooks(node, books, new Set());
            if (books.length) {
              const module = {
                title, books,
                itemId: extractItemId(node.Title?.JumpActionUrl || ''),
                column: node.CommonExt?.ColumnName || '',
              };
              const key = `${title}|${module.column}`;
              if (!found.has(key) || found.get(key).books.length < books.length) found.set(key, module);
            }
          }
          Object.values(node).forEach(visit);
        };
        visit(root);
        return Array.from(found.values());
      }

      function collectHomeBooks(node, books, seen) {
        if (!node || typeof node !== 'object') return;
        if (node.BookId && (node.BookName || node.ItemName)) {
          const id = String(node.BookId);
          if (!seen.has(id)) { seen.add(id); books.push(normalizeHomeBook(node)); }
          return;
        }
        Object.values(node).forEach((value) => collectHomeBooks(value, books, seen));
      }

      function normalizeHomeBook(book) {
        const tagNames = (book.Tags || book.BookTags || []).map((tag) => typeof tag === 'string' ? tag : tag.TagName).filter(Boolean);
        return {
          id: book.BookId,
          name: book.BookName || book.ItemName || '未命名作品',
          author: book.AuthorName || book.ItemSubName || '',
          description: book.Description || book.Desc || book.ItemDesc || '',
          category: [book.CategoryName, book.SubCategoryName].filter(Boolean).join(' · ') || book.Tip || tagNames.slice(0, 2).join(' · '),
          words: Number(book.WordsCount || book.BusinessExt?.WordsCount || 0),
          status: book.BookStatus || book.ActionStatusString || book.BookCoverTags?.[0]?.ImageTagText || '',
        };
      }

      function extractItemId(url) {
        const match = String(url).match(/["']?itemId["']?\s*[:=]\s*["']?(\d+)/i);
        return match ? match[1] : '';
      }

      function renderHome(data) {
        $('homeMeta').textContent = `${data.modules.length} 个精选模块`;
        if (!data.modules.length) {
          $('homeModules').innerHTML = '<div class="home-state">当前书城暂无可展示模块</div>';
          return;
        }
        $('homeModules').innerHTML = data.modules.map((module) => `
          <section class="home-module">
            <div class="module-head"><h3>${escapeHtml(module.title)}</h3>${module.itemId ? `<button class="module-more" type="button" data-list-id="${escapeHtml(module.itemId)}" data-list-name="${escapeHtml(module.title)}">查看全部 ›</button>` : ''}</div>
            <div class="shelf">${module.books.slice(0, 4).map(renderShelfBook).join('')}</div>
          </section>`).join('');
      }

      function renderShelfBook(book) {
        const name = escapeHtml(book.name);
        const cover = `https://bookcover.yuewen.com/qdbimg/349573/${encodeURIComponent(book.id)}/180`;
        return `<button class="shelf-book" type="button" data-book-id="${escapeHtml(book.id)}">
          <div class="shelf-cover"><div class="cover-fallback">${name.slice(0, 4)}</div><img src="${cover}" alt="${name}封面" loading="lazy" onerror="this.style.display='none'"></div>
          <div class="shelf-info"><h4>${name}</h4><div class="shelf-byline">${escapeHtml(book.author || '未知作者')}</div><p class="shelf-desc">${escapeHtml(book.description || '暂无简介')}</p><div class="shelf-meta">${escapeHtml(book.category || (book.words ? `${formatWords(book.words)}字` : ''))}</div></div>
        </button>`;
      }

      async function loadHomeList(itemId, name) {
        $('homeMeta').textContent = '正在加载完整榜单';
        $('homeModules').innerHTML = '<div class="home-state"><div><div class="spinner"></div>正在加载榜单</div></div>';
        try {
          const response = await fetch(`${api}?action=list&item_id=${encodeURIComponent(itemId)}&page=1&page_size=20`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '榜单加载失败');
          const data = payload.Data?.Data || {};
          const rawBooks = (data.Items && data.Items.length ? data.Items : data.ComicItems) || [];
          const books = rawBooks.map(normalizeHomeBook);
          $('homeMeta').textContent = `${books.length} 本作品`;
          $('homeModules').innerHTML = `<section class="home-module"><div class="module-head"><h3>${escapeHtml(name)}</h3><a class="module-back" href="${escapeHtml(frontendUrl('home'))}" data-home-back>返回书城</a></div><div class="shelf">${books.map(renderShelfBook).join('')}</div></section>`;
          setConnection(true, '接口正常');
        } catch (error) {
          $('homeMeta').textContent = '未获取到数据';
          $('homeModules').innerHTML = `<div class="home-state error">${escapeHtml(error.message)}</div>`;
          setConnection(false, '请求失败');
        }
      }

      async function loadSearchDiscovery(force = false) {
        if (!force && state.searchDiscovery) { renderSearchDiscovery(); return; }
        $('searchContent').innerHTML = '<div class="home-state"><div><div class="spinner"></div>正在加载搜索推荐</div></div>';
        try {
          const response = await fetch('search.php?action=discovery&site=1');
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '搜索推荐加载失败');
          state.searchDiscovery = payload.Data || {};
          if (!state.searchKeyword) renderSearchDiscovery();
          setConnection(true, '接口正常');
        } catch (error) {
          $('searchContent').innerHTML = `<div class="home-state error">${escapeHtml(error.message)}</div>`;
          setConnection(false, '请求失败');
        }
      }

      function renderSearchDiscovery() {
        const data = state.searchDiscovery || {};
        const hotWords = data.HotWordData?.WordList || [];
        const suggestions = (data.ShardWordData || []).filter((item) => Number(item.SearchWordHideFlag) === 0).slice(0, 12);
        const rank = data.BookRankData?.BookRankList?.[0];
        const books = (rank?.BookList || []).slice(0, 12);
        const chips = (items, field) => items.map((item) => `<button class="search-chip" type="button" data-search-word="${escapeHtml(item[field])}">${escapeHtml(item[field])}</button>`).join('');
        $('searchContent').innerHTML = `<div class="search-discovery">
          ${hotWords.length ? `<section class="discovery-section"><div class="discovery-head"><h2>热门搜索</h2><span>${hotWords.length} 个热词</span></div><div class="search-chips">${chips(hotWords, 'WordName')}</div></section>` : ''}
          ${suggestions.length ? `<section class="discovery-section"><div class="discovery-head"><h2>猜你想搜</h2><span>来自搜索页推荐</span></div><div class="search-chips">${chips(suggestions, 'SearchWord')}</div></section>` : ''}
          ${books.length ? `<section class="discovery-section"><div class="discovery-head"><h2>热搜榜</h2><span>${escapeHtml(rank?.TopId ? `榜单 ${rank.TopId}` : '')}</span></div><div class="search-rank">${books.map((book, index) => `<button class="search-rank-item" type="button" data-book-id="${escapeHtml(book.BookId)}"><span class="search-rank-num">${index + 1}</span><span class="search-rank-name">${escapeHtml(book.BookName)}</span><span class="search-rank-score">${escapeHtml(book.Score || '')}${book.Unit ? ` ${escapeHtml(book.Unit)}` : ''}</span></button>`).join('')}</div></section>` : ''}
        </div>`;
      }

      async function runSearch(page = 1) {
        const keyword = $('searchKeyword').value.trim();
        if (!keyword) return;
        state.searchKeyword = keyword;
        state.searchPage = page;
        if ((window.__QIDIAN_ENTRY__ || '') === 'search') {
          history.replaceState(null, '', frontendUrl('search', { q: keyword, page }));
        }
        $('searchContent').innerHTML = '<div class="home-state"><div><div class="spinner"></div>正在搜索</div></div>';
        try {
          const response = await fetch(`search.php?keyword=${encodeURIComponent(keyword)}&page=${page}&page_size=20`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '搜索失败');
          const books = [];
          const seen = new Set();
          (payload.Data?.CardList || []).forEach((card) => (card.Body || []).forEach((row) => {
            const book = row.ItemData;
            if (book?.BookId && !seen.has(String(book.BookId))) { seen.add(String(book.BookId)); books.push(book); }
          }));
          state.searchBooks = books;
          state.searchTotal = Number(payload.Data?.TotalCount || books.length);
          renderSearchResults();
          setConnection(true, '接口正常');
        } catch (error) {
          $('searchContent').innerHTML = `<div class="home-state error">${escapeHtml(error.message)}</div>`;
          setConnection(false, '请求失败');
        }
      }

      function renderSearchResults() {
        const books = state.searchBooks;
        $('searchContent').innerHTML = `
          <div class="search-header"><h2>搜索结果</h2><span class="results-meta">${state.searchTotal.toLocaleString('zh-CN')} 条结果</span></div>
          ${books.length ? `<div class="search-grid">${books.map(renderSearchBook).join('')}</div>` : '<div class="home-state">没有找到相关作品</div>'}
          <div class="search-pagination"><button class="text-button" type="button" data-search-page="${state.searchPage - 1}" ${state.searchPage <= 1 ? 'disabled' : ''}>上一页</button><span class="page-number">第 ${state.searchPage} 页</span><button class="text-button" type="button" data-search-page="${state.searchPage + 1}" ${books.length < 20 ? 'disabled' : ''}>下一页</button></div>`;
      }

      function renderSearchBook(book) {
        const normalized = normalizeHomeBook(book);
        const name = escapeHtml(normalized.name);
        const cover = book.BookCover || `https://bookcover.yuewen.com/qdbimg/349573/${encodeURIComponent(normalized.id)}/180`;
        return `<button class="search-book" type="button" data-book-id="${escapeHtml(normalized.id)}">
          <div class="search-cover"><div class="cover-fallback">${name.slice(0, 4)}</div><img src="${escapeHtml(cover)}" alt="${name}封面" loading="lazy" onerror="this.style.display='none'"></div>
          <div class="search-info"><h3>${name}</h3><div class="byline">${escapeHtml(normalized.author || '未知作者')} · ${escapeHtml(normalized.category || '未分类')}</div><p>${escapeHtml(normalized.description || '暂无简介')}</p><div class="shelf-meta">${normalized.words ? `${formatWords(normalized.words)}字` : ''}</div></div>
        </button>`;
      }

      function openBook(bookId) {
        location.assign(frontendUrl('detail', {
          book_id: bookId, origin: state.view, return_url: currentRelativeUrl(),
        }));
      }

      async function loadBook(bookId, resumeChapterId = '') {
        state.currentBookInShelf = false;
        showView('detail');
        $('detailContent').innerHTML = `<div class="home-state"><div><div class="spinner"></div>${resumeChapterId ? '正在打开上次阅读章节' : '正在加载书籍'}</div></div>`;
        try {
          const [detailResponse, catalogResponse] = await Promise.all([
            fetch(`detail.php?book_id=${encodeURIComponent(bookId)}`),
            fetch(`catalog.php?book_id=${encodeURIComponent(bookId)}`),
          ]);
          const [detailPayload, catalogPayload] = await Promise.all([detailResponse.json(), catalogResponse.json()]);
          if (!detailResponse.ok || detailPayload.Result !== 0) throw new Error(detailPayload.detail || detailPayload.Message || '详情加载失败');
          if (!catalogResponse.ok || catalogPayload.Result !== 0) throw new Error(catalogPayload.detail || catalogPayload.Message || '目录加载失败');
          state.detail = detailPayload.Data;
          state.catalog = catalogPayload.Data;
          state.chapters = (state.catalog.Chapters || []).filter((chapter) => Number(chapter.C) > 0 && chapter.N).map((chapter) => ({
            id: String(chapter.C), name: chapter.N, vip: Number(chapter.V) === 1, words: Number(chapter.W || 0), order: Number(chapter.O || 0),
            updatedAt: Number(chapter.DisplayTime || chapter.T || 0),
          }));
          state.catalogLimit = 100;
          state.catalogOrder = 'asc';
          state.catalogExpanded = false;
          if (state.user) {
            try {
              const membership = await bookshelfRequest('contains', null, `&book_id=${encodeURIComponent(bookId)}`);
              state.currentBookInShelf = membership.contains === true;
            } catch (_) {}
          }
          if (resumeChapterId) {
            const resumeIndex = state.chapters.findIndex((chapter) => chapter.id === String(resumeChapterId));
            if (resumeIndex >= 0) { await loadChapter(resumeIndex); return; }
            setConnection(false, '原阅读章节已不在目录中');
          }
          renderBookDetail();
          setConnection(true, '接口正常');
        } catch (error) {
          $('detailContent').innerHTML = `<div class="detail-nav"><a class="back-button" href="${escapeHtml(detailOriginUrl())}" data-back-origin>← ${escapeHtml(detailBackLabel())}</a></div><div class="home-state error">${escapeHtml(error.message)}</div>`;
          setConnection(false, '请求失败');
        }
      }

      function detailBackLabel() {
        return { home: '返回书城', ranking: '返回榜单', search: '返回搜索', bookshelf: '返回书架' }[state.detailOrigin] || '返回上一页';
      }

      function renderBookDetail() {
        const base = state.detail?.BaseBookInfo || {};
        const author = state.detail?.AuthorInfo?.Author || state.catalog?.Author || '';
        const id = base.BookId || state.catalog?.BookId;
        const name = base.BookName || state.catalog?.BookName || '未命名作品';
        const cover = `https://bookcover.yuewen.com/qdbimg/349573/${encodeURIComponent(id)}/180`;
        const tags = [base.CategoryName, base.SubCategoryName, base.BookStatus, base.IsVip ? 'VIP' : ''].filter(Boolean);
        const hasBlackListValue = base.FreshManSimple?.IsInBlackList !== undefined && base.FreshManSimple?.IsInBlackList !== null;
        const blackListValue = Number(base.FreshManSimple?.IsInBlackList);
        const canDownload = hasBlackListValue && blackListValue === 0;
        const chapterCount = Number(base.TotalChapterCount || state.chapters.length);
        const facts = [
          ...(hasBlackListValue ? [['', blackListValue === 1 ? '不限免' : '限免']] : []),
          ['章节', `${chapterCount} 章`],
        ];
        $('detailContent').innerHTML = `
          <div class="detail-nav"><a class="back-button" href="${escapeHtml(detailOriginUrl())}" data-back-origin>← ${escapeHtml(detailBackLabel())}</a></div>
          <section class="detail-summary">
            <div class="detail-cover"><div class="cover-fallback">${escapeHtml(name).slice(0, 4)}</div><img src="${cover}" alt="${escapeHtml(name)}封面" onerror="this.style.display='none'"></div>
            <div class="detail-main"><h2>${escapeHtml(name)}</h2><div class="detail-author">${escapeHtml(author || '未知作者')} · ${base.WordsCnt ? `${formatWords(Number(base.WordsCnt))}字` : `${state.chapters.length}章`}</div><div class="detail-tags">${tags.map((tag) => `<span class="detail-tag">${escapeHtml(tag)}</span>`).join('')}</div><div class="detail-facts">${facts.map(([label, value]) => `<span class="detail-fact">${label ? `<strong>${escapeHtml(label)}</strong> ` : ''}${escapeHtml(value)}</span>`).join('')}</div><div class="detail-actions"><button class="detail-shelf ${state.currentBookInShelf ? 'active' : ''}" type="button" data-toggle-shelf>${state.currentBookInShelf ? '移出书架' : '加入书架'}</button>${canDownload ? '<button class="detail-download" type="button" data-download-book>↓ 下载本书</button>' : ''}</div></div>
            <p class="detail-desc">${escapeHtml(base.Description || '暂无简介')}</p>
          </section>
          <div class="catalog-toolbar"><h3>目录 <span class="results-meta">${state.chapters.length} 章</span></h3><div class="catalog-actions"><input id="chapterSearch" type="search" placeholder="搜索章节" aria-label="搜索章节"><div class="catalog-sort" aria-label="目录排序"><button type="button" data-catalog-sort="asc">正序</button><button type="button" data-catalog-sort="desc">倒序</button></div><button class="text-button catalog-expand" type="button" data-catalog-expand>${state.catalogExpanded ? '收起' : '全部展开'}</button></div></div>
          <div id="catalogContent"></div>`;
        renderCatalog();
      }

      function renderCatalog() {
        const keyword = ($('chapterSearch')?.value || '').trim().toLowerCase();
        const filtered = state.chapters.map((chapter, index) => ({ ...chapter, index })).filter((chapter) => !keyword || chapter.name.toLowerCase().includes(keyword));
        if (state.catalogOrder === 'desc') filtered.reverse();
        const visible = state.catalogExpanded ? filtered : filtered.slice(0, state.catalogLimit);
        document.querySelectorAll('[data-catalog-sort]').forEach((button) => button.classList.toggle('active', button.dataset.catalogSort === state.catalogOrder));
        const expand = document.querySelector('[data-catalog-expand]');
        if (expand) expand.textContent = state.catalogExpanded ? '收起' : '全部展开';
        $('catalogContent').innerHTML = `<div class="catalog-list">${visible.map((chapter) => `
          <button class="chapter" type="button" data-chapter-index="${chapter.index}"><span class="chapter-name">${escapeHtml(chapter.name)}</span>${chapter.vip ? '<span class="vip-badge">VIP</span>' : ''}${chapter.updatedAt ? `<span class="chapter-time" title="更新时间：${escapeHtml(formatChapterUpdateTime(chapter.updatedAt, true))}">${escapeHtml(formatChapterUpdateTime(chapter.updatedAt))}</span>` : ''}</button>`).join('')}</div>
          ${visible.length < filtered.length ? `<button class="text-button catalog-more" type="button" data-more-chapters>加载更多（${filtered.length - visible.length}）</button>` : ''}`;
      }

      function formatChapterUpdateTime(timestamp, full = false) {
        const numeric = Number(timestamp);
        const date = new Date(numeric > 0 && numeric < 1000000000000 ? numeric * 1000 : numeric);
        if (!Number.isFinite(date.getTime())) return '';
        const pad = (value) => String(value).padStart(2, '0');
        const compact = `${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        return full ? `${date.getFullYear()}-${compact}` : compact;
      }

      function isRecentChapter(chapter) {
        const numeric = Number(chapter?.updatedAt || 0);
        if (!Number.isFinite(numeric) || numeric <= 0) return false;
        const timestamp = numeric < 1000000000000 ? numeric * 1000 : numeric;
        return timestamp > Date.now() - 48 * 60 * 60 * 1000;
      }

      function openChapter(index) {
        const chapter = state.chapters[index];
        const bookId = String(state.catalog?.BookId || state.detail?.BaseBookInfo?.BookId || '');
        if (!chapter || !bookId) return;
        if (state.readerPageMode === 'vertical' && $('readerContent')) {
          const direction = index > state.currentChapter ? 'append' : 'prepend';
          loadChapter(index, direction);
          return;
        }
        location.assign(frontendUrl('reader', {
          book_id: bookId, chapter_id: chapter.id, source: 'detail', origin: state.detailOrigin,
          catalog_url: catalogReturnUrl(),
        }));
      }

      const flowChapterLoads = new Set();
      let changingChapter = false;
      let changingChapterTimer = 0;

      function releaseChangingChapter(delay = 0) {
        if (changingChapterTimer) {
          clearTimeout(changingChapterTimer);
          changingChapterTimer = 0;
        }
        if (delay > 0) {
          changingChapterTimer = setTimeout(() => {
            changingChapter = false;
            changingChapterTimer = 0;
          }, delay);
          return;
        }
        changingChapter = false;
      }

      function lockChangingChapter() {
        changingChapter = true;
        if (changingChapterTimer) {
          clearTimeout(changingChapterTimer);
          changingChapterTimer = 0;
        }
      }

      async function loadChapter(index, flow = null) {
        const chapter = state.chapters[index];
        if (!chapter) {
          if (flow) releaseChangingChapter();
          return;
        }
        if (flow && (document.querySelector(`[data-flow-index="${index}"]`) || flowChapterLoads.has(index))) {
          releaseChangingChapter(120);
          return;
        }
        if (flow) flowChapterLoads.add(index);
        if (isRecentChapter(chapter)) {
          if (flow) {
            flowChapterLoads.delete(index);
            appendFlowNotice(index, chapter, flow, '该章节不支持访问');
            releaseChangingChapter(280);
            return;
          }
          state.currentChapter = index;
          $('detailContent').innerHTML = `<div class="detail-nav"><a class="back-button" href="${escapeHtml(catalogReturnUrl())}" data-back-detail>← 返回目录</a></div><div class="home-state error">该章节不支持访问</div>`;
          return;
        }
        if (chapter.vip && !state.user) {
          if (flow) {
            flowChapterLoads.delete(index);
            appendFlowNotice(index, chapter, flow, '该章节需要登录后阅读');
            releaseChangingChapter(280);
            return;
          }
          showAuth('login', '您还未登录');
          return;
        }
        if (!flow) {
          state.currentChapter = index;
          $('detailContent').innerHTML = '<div class="home-state"><div><div class="spinner"></div>正在加载正文</div></div>';
        } else if (!Number.isInteger(state.currentChapter) || state.currentChapter < 0) {
          state.currentChapter = index;
        }
        try {
          const params = new URLSearchParams({ book_id: String(state.catalog.BookId), chapter_id: chapter.id });
          if (chapter.vip) params.set('vip', '1');
          const response = await fetch(`content.php?${params}`, {
            headers: chapter.vip && state.contentToken ? { 'X-Content-Token': state.contentToken } : {},
          });
          const credentialPool = response.headers.get('X-Qidian-Credential-Pool');
          if (['recent', 'archive'].includes(credentialPool)) {
            state.lastCredentialPool = credentialPool;
            state.lastCredentialId = 0;
            savePreference('qidian-last-credential-pool', credentialPool);
            savePreference('qidian-last-credential-id', 0);
          }
          const credentialId = Number.parseInt(response.headers.get('X-Qidian-Credential-Id') || '', 10);
          if (Number.isInteger(credentialId) && credentialId > 0) {
            state.lastCredentialId = credentialId;
            savePreference('qidian-last-credential-id', credentialId);
          }
          const payload = await response.json();
          if (!response.ok || payload.detail) throw new Error(payload.detail || '正文加载失败');
          const content = payload.Content || payload.content || payload.Data?.Content || '';
          if (!content) throw new Error('正文内容为空');
          const blocks = payload.Blocks || payload.blocks || payload.Data?.Blocks || [];
          if (flow) appendFlowChapter(index, chapter, content, blocks, flow);
          else {
            renderReader(chapter, content, blocks);
            syncReadingProgress(chapter, index);
          }
          setConnection(true, '接口正常');
        } catch (error) {
          if (flow) setConnection(false, error.message);
          else $('detailContent').innerHTML = `<div class="detail-nav"><a class="back-button" href="${escapeHtml(catalogReturnUrl())}" data-back-detail>← 返回目录</a></div><div class="home-state error">${escapeHtml(error.message)}</div>`;
          setConnection(false, '请求失败');
        } finally {
          if (flow) {
            flowChapterLoads.delete(index);
            releaseChangingChapter(280);
          }
        }
      }

      async function syncReadingProgress(chapter, index) {
        if (!state.user || !state.currentBookInShelf) return;
        try {
          const payload = await bookshelfRequest('progress', {
            book_id: String(state.detail?.BaseBookInfo?.BookId || state.catalog?.BookId || ''),
            chapter_id: chapter.id,
            chapter_name: chapter.name,
            chapter_index: index,
          });
          if (payload.saved) state.bookshelfLoaded = false;
        } catch (_) {}
      }

      function normalizeReaderImageUrl(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        try {
          const url = new URL(raw.startsWith('//') ? `https:${raw}` : raw, location.href);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch (_) { return ''; }
      }

      function readerIllustrations(blocks) {
        const grouped = new Map();
        (Array.isArray(blocks) ? blocks : []).forEach((block) => {
          if (String(block?.Type || block?.type || '').toLowerCase() !== 'image') return;
          const url = normalizeReaderImageUrl(block.Url || block.url);
          if (!url) return;
          const attach = Math.max(0, Math.floor(Number(block.Attach ?? block.attach ?? 0) || 0));
          const width = Math.max(0, Math.min(4096, Math.floor(Number(block.Width ?? block.width ?? 0) || 0)));
          const height = Math.max(0, Math.min(4096, Math.floor(Number(block.Height ?? block.height ?? 0) || 0)));
          if (!grouped.has(attach)) grouped.set(attach, []);
          grouped.get(attach).push({ url, width, height });
        });
        return grouped;
      }

      function renderReaderImages(images) {
        return (images || []).map((image) => {
          const dimensions = `${image.width ? ` width="${image.width}"` : ''}${image.height ? ` height="${image.height}"` : ''}`;
          return `<figure class="reader-illustration"><a href="${escapeHtml(image.url)}" target="_blank" rel="noopener noreferrer" title="查看原图"><img src="${escapeHtml(image.url)}"${dimensions} loading="lazy" decoding="async" alt="正文插图"></a></figure>`;
        }).join('');
      }

      function readerEmbeddedImage(line) {
        const match = String(line || '').trim().match(/^<img\b([^>]*)\/?\s*>$/i);
        if (!match) return '';
        const attributes = match[1];
        const srcMatch = attributes.match(/\bsrc\s*=\s*(["'])(.*?)\1/i);
        const url = normalizeReaderImageUrl(String(srcMatch?.[2] || '').replace(/&amp;/gi, '&'));
        if (!url) return '';
        const numberAttribute = (name) => {
          const value = attributes.match(new RegExp(`\\b${name}\\s*=\\s*(["'])(\\d{1,4})\\1`, 'i'))?.[2];
          return Math.max(0, Math.min(4096, Math.floor(Number(value) || 0)));
        };
        return renderReaderImages([{ url, width: numberAttribute('width'), height: numberAttribute('height') }]);
      }

      function insertFlowSection(html, flow) {
        const article = $('readerFlow');
        if (!article) return false;
        const oldHeight = document.documentElement.scrollHeight;
        const oldScroll = window.scrollY;
        if (flow === 'prepend') article.insertAdjacentHTML('afterbegin', html);
        else article.insertAdjacentHTML('beforeend', html);
        if (flow === 'prepend') {
          const heightDelta = document.documentElement.scrollHeight - oldHeight;
          window.scrollTo({ top: oldScroll + heightDelta, behavior: 'auto' });
        }
        return true;
      }

      function appendFlowChapter(index, chapter, content, blocks, flow) {
        if (!insertFlowSection(buildReaderChapterHtml(chapter, content, blocks, index), flow)) {
          renderReader(chapter, content, blocks);
          return;
        }
        setupReaderNavigation();
        loadCommentSummary(chapter, index);
      }

      function appendFlowNotice(index, chapter, flow, message) {
        if (document.querySelector(`[data-flow-index="${index}"]`)) return;
        const html = `<section class="reader-flow-chapter reader-flow-blocked" data-flow-index="${index}" data-chapter-id="${escapeHtml(chapter.id)}" data-flow-blocked="1"><h2 class="reader-flow-chapter-title">${escapeHtml(chapter.name)}</h2><div class="reader-flow-notice">${escapeHtml(message)}</div></section>`;
        if (!insertFlowSection(html, flow)) return;
        setConnection(false, message);
      }

      function buildReaderBody(content, blocks = [], chapterIndex = -1) {
        const lines = String(content).split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        const hasEmbeddedImages = lines.some((line) => readerEmbeddedImage(line) !== '');
        const paragraphs = lines.filter((line) => readerEmbeddedImage(line) === '');
        const illustrations = readerIllustrations(blocks);
        const chapterAttr = Number.isInteger(chapterIndex) && chapterIndex >= 0 ? ` data-paragraph-chapter="${chapterIndex}"` : '';
        let paragraphIndex = 0;
        const embeddedBody = lines.map((line) => {
          const image = readerEmbeddedImage(line);
          if (image) return image;
          paragraphIndex += 1;
          return `<div class="reader-paragraph" data-paragraph-id="${paragraphIndex}"${chapterAttr}><p>${escapeHtml(line)}</p><button class="paragraph-comment" type="button" data-open-paragraph="${paragraphIndex}" data-comment-chapter="${chapterIndex}" aria-label="查看第 ${paragraphIndex} 段评论"><span>评</span><b data-comment-count hidden>0</b></button></div>`;
        }).join('');
        const legacyBody = `${renderReaderImages(illustrations.get(0))}${paragraphs.map((text, index) => `<div class="reader-paragraph" data-paragraph-id="${index + 1}"${chapterAttr}><p>${escapeHtml(text)}</p><button class="paragraph-comment" type="button" data-open-paragraph="${index + 1}" data-comment-chapter="${chapterIndex}" aria-label="查看第 ${index + 1} 段评论"><span>评</span><b data-comment-count hidden>0</b></button></div>${renderReaderImages(illustrations.get(index + 1))}`).join('')}${Array.from(illustrations.entries()).filter(([attach]) => attach > paragraphs.length).map(([, images]) => renderReaderImages(images)).join('')}`;
        return hasEmbeddedImages ? embeddedBody : legacyBody;
      }

      function buildReaderChapterHtml(chapter, content, blocks = [], index = -1) {
        return `<section class="reader-flow-chapter" data-flow-index="${index}" data-chapter-id="${escapeHtml(chapter.id)}"><h2 class="reader-flow-chapter-title">${escapeHtml(chapter.name)}</h2>${buildReaderBody(content, blocks, index)}</section>`;
      }

      function renderReader(chapter, content, blocks = []) {
        const horizontalMode = state.readerPageMode === 'horizontal';
        const chapterIndex = state.currentChapter;
        const body = buildReaderBody(content, blocks, chapterIndex);
        $('detailContent').innerHTML = `<div class="reader-shell">
          <div class="reader-toolbar"><a class="back-button" href="${escapeHtml(catalogReturnUrl())}" data-back-detail>← 目录</a><div class="reader-actions"><button class="icon-text" type="button" data-chapter-comments title="查看本章评论">章评</button><button class="icon-text" type="button" data-spacing title="切换段距">↕</button><button class="icon-text" type="button" data-font="-1" title="减小字号">A−</button><button class="icon-text" type="button" data-font="1" title="增大字号">A+</button><button class="icon-text" type="button" data-page-mode title="切换翻页模式">${horizontalMode ? '⇅' : '⇄'}</button></div></div>
          <article class="reader-article ${horizontalMode ? '' : 'vertical-mode'}"><h2 ${horizontalMode ? '' : 'hidden'}>${escapeHtml(chapter.name)}</h2><div id="readerContent" class="reader-content ${horizontalMode ? 'horizontal-pages' : 'vertical-pages'} spacing-${escapeHtml(state.readerSpacing)}" style="font-size:${state.readerFontSize}px">${horizontalMode ? body : `<div id="readerFlow">${buildReaderChapterHtml(chapter, content, blocks, chapterIndex)}</div>`}</div>
          <button class="reader-turn-zone previous" type="button" data-reader-turn="-1" aria-label="上一页"></button><button class="reader-turn-zone next" type="button" data-reader-turn="1" aria-label="下一页"></button></article>
        </div>`;
        setupReaderNavigation();
        loadCommentSummary(chapter, chapterIndex);
        if (state.readerPageMode === 'vertical' && verticalChapterLanding === 'bottom') {
          verticalChapterLanding = 'top';
          const scrollToChapterEnd = () => window.scrollTo({ top: Math.max(0, document.documentElement.scrollHeight - window.innerHeight), behavior: 'auto' });
          requestAnimationFrame(() => requestAnimationFrame(scrollToChapterEnd));
          setTimeout(scrollToChapterEnd, 180);
          setTimeout(scrollToChapterEnd, 600);
          document.querySelectorAll('#readerContent img').forEach((image) => {
            if (!image.complete) image.addEventListener('load', scrollToChapterEnd, { once: true });
          });
        } else {
          verticalChapterLanding = 'top';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function turnReaderPage(direction) {
        const content = $('readerContent');
        if (!content) return;
        const gap = parseFloat(getComputedStyle(content).columnGap || 0);
        const pageWidth = content.clientWidth + gap;
        const total = Math.max(1, Math.ceil(content.scrollWidth / pageWidth));
        const current = Math.min(total - 1, Math.round(content.scrollLeft / pageWidth));
        const target = current + direction;
        if (target >= 0 && target < total) {
          content.scrollTo({ left: target * pageWidth, behavior: 'smooth' });
          return;
        }
        const chapterIndex = state.currentChapter + direction;
        if (chapterIndex >= 0 && chapterIndex < state.chapters.length) openChapter(chapterIndex);
      }

      let verticalReaderCleanup = null;
      let verticalChapterLanding = 'top';

      function setupReaderNavigation() {
        if (verticalReaderCleanup) { verticalReaderCleanup(); verticalReaderCleanup = null; }
        const content = $('readerContent');
        if (!content) return;
        if (state.readerPageMode === 'horizontal') {
          window.addEventListener('resize', () => { content.scrollLeft = 0; }, { once: true });
          return;
        }
        let touchStartY = 0;
        const loadedIndexes = () => Array.from(document.querySelectorAll('[data-flow-index]')).map((item) => Number(item.dataset.flowIndex)).filter(Number.isInteger);
        const atTop = () => window.scrollY <= 120;
        const atBottom = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 600;
        const openPrevious = () => {
          if (changingChapter || state.readerPageMode !== 'vertical' || $('readerContent') !== content || !atTop()) return false;
          const indexes = loadedIndexes();
          const previous = indexes.length ? Math.min(...indexes) - 1 : state.currentChapter - 1;
          if (previous < 0) return false;
          lockChangingChapter();
          openChapter(previous);
          return true;
        };
        const openNext = () => {
          if (changingChapter || state.readerPageMode !== 'vertical' || $('readerContent') !== content || !atBottom()) return false;
          const indexes = loadedIndexes();
          const next = indexes.length ? Math.max(...indexes) + 1 : state.currentChapter + 1;
          if (next >= state.chapters.length) return false;
          lockChangingChapter();
          openChapter(next);
          return true;
        };
        const syncCurrentChapter = () => {
          const middle = window.scrollY + window.innerHeight / 2;
          let bestIndex = state.currentChapter;
          let bestDistance = Infinity;
          document.querySelectorAll('[data-flow-index]').forEach((section) => {
            const index = Number(section.dataset.flowIndex);
            if (!Number.isInteger(index)) return;
            if (section.dataset.flowBlocked === '1') return;
            const rect = section.getBoundingClientRect();
            const absoluteTop = rect.top + window.scrollY;
            const absoluteBottom = absoluteTop + rect.height;
            if (middle < absoluteTop || middle > absoluteBottom) return;
            const center = absoluteTop + rect.height / 2;
            const distance = Math.abs(center - middle);
            if (distance < bestDistance) {
              bestDistance = distance;
              bestIndex = index;
            }
          });
          if (bestIndex !== state.currentChapter) {
            state.currentChapter = bestIndex;
            const chapter = state.chapters[bestIndex];
            if (chapter) syncReadingProgress(chapter, bestIndex);
          }
        };
        const onScroll = () => {
          if (changingChapter) return;
          syncCurrentChapter();
          if (atBottom()) openNext();
          else if (atTop()) openPrevious();
        };
        const onWheel = (event) => {
          if (changingChapter) return;
          if (event.deltaY < 0) openPrevious();
          else if (event.deltaY > 0) openNext();
        };
        const onTouchStart = (event) => {
          if (changingChapter) return;
          touchStartY = event.touches[0]?.clientY || 0;
        };
        const onTouchEnd = (event) => {
          if (changingChapter) return;
          const endY = event.changedTouches[0]?.clientY || touchStartY;
          const delta = touchStartY - endY;
          if (delta > 36) setTimeout(openNext, 80);
          else if (delta < -36) setTimeout(openPrevious, 80);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('wheel', onWheel, { passive: true });
        window.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchend', onTouchEnd, { passive: true });
        verticalReaderCleanup = () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('wheel', onWheel);
          window.removeEventListener('touchstart', onTouchStart);
          window.removeEventListener('touchend', onTouchEnd);
        };
      }

      async function loadCommentSummary(chapter, chapterIndex = state.currentChapter) {
        const targetIndex = Number.isInteger(chapterIndex) && chapterIndex >= 0 ? chapterIndex : state.currentChapter;
        try {
          const params = new URLSearchParams({
            action: 'summary', book_id: String(state.catalog.BookId), chapter_id: chapter.id,
          });
          const response = await fetch(`comments.php?${params}`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) return;
          if (state.chapters[targetIndex]?.id !== chapter.id) return;
          const rows = payload.Data?.Getparagraphscommentcounts?.DataList || [];
          if (!rows.length) return;

            || document.querySelector(`[data-flow-index="${targetIndex}"]`)

            const badge = button.querySelector('[data-comment-count]');

            button.title = count > 0 ? `查看 ${count} 条段评` : '查看段评';
            if (badge) { badge.textContent = count > 999 ? '999+' : String(count); badge.hidden = count <= 0; }
          });
        } catch (_) {}
      }

      function safeMediaUrl(value) {
        try {
          const url = new URL(String(value || ''));
          return url.protocol === 'https:' ? url.href : '';
        } catch (_) { return ''; }
      }

      function commentImages(item) {
        const found = [];
        const visit = (value) => {
          if (!value || found.length >= 9) return;
          if (Array.isArray(value)) { value.forEach(visit); return; }
          if (typeof value === 'object') { Object.values(value).forEach(visit); return; }
          if (typeof value !== 'string') return;
          const text = value.trim();
          if (text.startsWith('{') || text.startsWith('[')) {
            try { visit(JSON.parse(text)); return; } catch (_) {}
          }
          const url = safeMediaUrl(text);
          if (url && !found.includes(url)) found.push(url);
        };
        [item.ImageDetail, item.PreImage, item.ImageUrl, item.Images, item.ImageList].forEach(visit);
        return found;
      }

      function hasRenderableComment(item) {
        if (!item || typeof item !== 'object') return false;
        const content = [item.Content, item.ImageMeaning].find((value) => typeof value === 'string' && value.trim());
        return Boolean(content || commentImages(item).length || safeMediaUrl(item.AudioUrl));
      }

      function formatCommentTime(value) {
        const numeric = Number(value || 0);
        if (!numeric) return '';
        const date = new Date(numeric < 100000000000 ? numeric * 1000 : numeric);
        return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('zh-CN', { hour12: false });
      }

      function renderCommentItem(item, isReply = false) {
        if (!hasRenderableComment(item)) return '';
        const name = item.UserName || '书友';
        const avatar = safeMediaUrl(item.UserHeadIcon);
        const badges = Array.from(new Set([item.ShowTag, ...(item.TitleInfoList || []).map((title) => title.TitleName)].filter(Boolean))).slice(0, 3);
        const images = commentImages(item);
        const audio = safeMediaUrl(item.AudioUrl);
        const content = item.Content || item.ImageMeaning || (audio ? '语音评论' : '图片评论');
        const replyCount = Number(item.ReviewCount || 0);
        const reviewId = String(item.Id || item.RootReviewId || '');
        const replyParagraph = Number(item.ParagraphId ?? state.commentParagraph ?? -1);
        const time = formatCommentTime(item.CreateTime);
        const location = item.IpLocation ? `IP ${item.IpLocation}` : '';
        return `<article class="comment-item">
          <div class="comment-avatar">${avatar ? `<img src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}头像" loading="lazy">` : escapeHtml(name).slice(0, 1)}</div>
          <div class="comment-body"><div class="comment-user"><span>${escapeHtml(name)}</span>${badges.map((badge) => `<span class="comment-badge">${escapeHtml(badge)}</span>`).join('')}</div>
            <p class="comment-text">${formatCommentContent(content)}</p>
            ${images.length ? `<div class="comment-media">${images.map((url) => `<img src="${escapeHtml(url)}" alt="评论图片" loading="lazy">`).join('')}</div>` : ''}
            ${audio ? `<div class="comment-media"><audio controls preload="none" src="${escapeHtml(audio)}"></audio></div>` : ''}
            <div class="comment-meta"><span>${escapeHtml(time)}</span><span>${escapeHtml(location)}</span><span>赞 ${Number(item.AgreeAmount || 0)}</span>${!isReply && replyCount > 0 ? `<button class="reply-button" type="button" data-load-replies="${escapeHtml(reviewId)}" data-reply-paragraph="${replyParagraph}" data-reply-total="${replyCount}">${replyCount} 条回复</button>` : ''}</div>
          </div>
          ${!isReply && replyCount > 0 ? `<div id="replies-${escapeHtml(reviewId)}" class="reply-list" hidden></div>` : ''}
        </article>`;
      }

      function renderComments() {
        const list = $('commentList');
        const previousScrollTop = list.scrollTop;
        list.innerHTML = state.commentItems.length
          ? state.commentItems.map((item) => renderCommentItem(item)).join('')
          : '<div class="comment-state">这里还没有评论</div>';
        list.scrollTop = previousScrollTop;
        $('commentMore').hidden = !state.commentHasMore;
        const displayTotal = Math.max(state.commentTotal, state.commentItems.length);
        if (state.commentParagraph === null) {
          $('commentTitle').textContent = `本章评论${displayTotal ? ` · ${displayTotal}` : ''}`;
        } else {
          $('commentTitle').textContent = `第 ${state.commentParagraph} 段${displayTotal ? ` · ${displayTotal}` : ''}`;
        }
      }

      async function loadComments(reset = false) {
        if (state.commentLoading) return;
        if (reset) { state.commentPage = 1; state.commentItems = []; state.commentTotal = 0; state.commentHasMore = false; }
        state.commentLoading = true;
        if (reset) $('commentList').innerHTML = '<div class="comment-state"><div class="spinner"></div>正在加载评论</div>';
        $('commentMore').disabled = true;
        $('commentMore').textContent = '正在加载';
        try {
          const chapterIndex = Number.isInteger(state.commentChapterIndex) && state.commentChapterIndex >= 0
            ? state.commentChapterIndex : state.currentChapter;
          const chapter = state.chapters[chapterIndex];
          if (!chapter) throw new Error('当前章节不存在');
          const params = new URLSearchParams({
            action: state.commentParagraph === null ? 'chapter' : 'paragraph',
            book_id: String(state.catalog.BookId), chapter_id: chapter.id,
            page: String(state.commentPage), page_size: '20',
          });
          if (state.commentParagraph !== null) {
            params.set('paragraph_id', String(state.commentParagraph));
            params.set('type', state.commentType);
            if (state.commentType === 'text') params.set('sort_type', String(state.commentSort));
          }
          const response = await fetch(`comments.php?${params}`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '评论加载失败');
          const data = payload.Data || {};
          const pagedRows = data.ExtraDataList || [];
          const rawRows = state.commentParagraph === null
            ? [...(data.DataList || []), ...(data.ChapterDataList || []), ...(data.SegmentDataList || []).flatMap((segment) => segment.DataList || []), ...pagedRows]
            : (data.DataList || []);
          const rows = rawRows.filter(hasRenderableComment);
          const known = new Set(state.commentItems.map((item) => String(item.Id)));
          const previousCount = known.size;
          rows.forEach((item) => {
            const id = String(item.Id);
            if (!known.has(id)) { known.add(id); state.commentItems.push(item); }
          });
          const segmentTotal = (data.SegmentDataList || []).reduce((sum, segment) => sum + Number(segment.ReviewCount || 0), 0);
          state.commentTotal = state.commentParagraph === null
            ? Number(data.ExtraTotalCount || data.TotalCount || data.ReviewTotalCount || (Number(data.ChapterReviewTotalCount || 0) + segmentTotal) || state.commentItems.length)
            : Number(data.TotalCount || data.ReviewTotalCount || state.commentItems.length);
          const addedCount = known.size - previousCount;
          state.commentHasMore = state.commentParagraph === null
            ? pagedRows.length > 0 && state.commentPage * 20 < state.commentTotal
            : rawRows.length >= 20 && state.commentItems.length < state.commentTotal;
          state.commentPage += 1;
          renderComments();
          if (state.commentParagraph !== null && state.commentType === 'text') {
            const counts = { image: Number(data.TotalImgCount || data.ExcellentImgCount || 0), audio: Number(data.TotalAudioCount || data.AudioCount || 0) };
            Object.entries(counts).forEach(([type, count]) => {
              const tab = document.querySelector(`[data-comment-type="${type}"]`);
              if (tab) tab.textContent = `${type === 'image' ? '图片' : '音频'}${count ? ` ${count}` : ''}`;
            });
          }
        } catch (error) {
          $('commentList').innerHTML = `<div class="comment-state error">${escapeHtml(error.message)}</div>`;
        } finally {
          state.commentLoading = false;
          $('commentMore').disabled = false;
          $('commentMore').textContent = '加载更多';
        }
      }

      function openComments(paragraphId = null, chapterIndex = state.currentChapter) {
        const resolvedChapter = Number.isInteger(chapterIndex) && chapterIndex >= 0 && state.chapters[chapterIndex]
          ? chapterIndex : state.currentChapter;
        state.commentParagraph = paragraphId;
        state.commentChapterIndex = resolvedChapter;
        state.commentType = 'text';
        state.commentSort = 0;
        $('commentSort').value = '0';
        $('commentSort').hidden = paragraphId === null;
        $('commentTabs').hidden = paragraphId === null;
        document.querySelectorAll('[data-comment-type]').forEach((tab) => {
          tab.classList.toggle('active', tab.dataset.commentType === 'text');
          tab.textContent = { text: '文字', image: '图片', audio: '音频' }[tab.dataset.commentType];
        });
        syncCommentViewport();
        if (!$('commentDialog').open) $('commentDialog').showModal();
        document.body.classList.add('comment-open');
        loadComments(true);
      }

      function syncCommentViewport() {
        const height = Math.max(320, Math.round(window.visualViewport?.height || window.innerHeight));
        document.documentElement.style.setProperty('--comment-viewport-height', `${height}px`);
      }

      async function loadReplies(button) {
        const isMore = Boolean(button.dataset.loadMoreReplies);
        const reviewId = button.dataset.loadReplies || button.dataset.loadMoreReplies;
        const paragraphId = button.dataset.replyParagraph;
        const container = document.getElementById(`replies-${reviewId}`);
        if (!reviewId || !container) return;
        if (!isMore) {
          if (!container.hidden) { container.hidden = true; return; }
          container.hidden = false;
          if (container.dataset.loaded === '1') return;
          container.innerHTML = '<div class="comment-state">正在加载回复</div>';
        } else {
          button.disabled = true;
          button.textContent = '正在加载';
        }
        try {
          const chapter = state.chapters[state.currentChapter];
          const page = isMore ? Number(button.dataset.replyPage || 2) : 1;
          const rootButton = document.querySelector(`[data-load-replies="${reviewId}"]`);
          const expected = Number(rootButton?.dataset.replyTotal || 0);
          const params = new URLSearchParams({
            action: 'replies', book_id: String(state.catalog.BookId), chapter_id: chapter.id,
            paragraph_id: paragraphId, root_review_id: reviewId, page: String(page), page_size: '20',
          });
          const response = await fetch(`comments.php?${params}`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '回复加载失败');
          const rawReplies = payload.Data?.DataList || [];
          const replies = rawReplies.filter(hasRenderableComment);
          if (!isMore) container.innerHTML = '';
          else button.remove();
          if (replies.length) container.insertAdjacentHTML('beforeend', replies.map((item) => renderCommentItem(item, true)).join(''));
          const loaded = container.querySelectorAll(':scope > .comment-item').length;
          const total = Number(payload.Data?.TotalCount || expected || loaded);
          const rawLoaded = Number(container.dataset.rawLoaded || 0) + rawReplies.length;
          container.dataset.rawLoaded = String(rawLoaded);
          if (rawReplies.length >= 20 && rawLoaded < total) {
            container.insertAdjacentHTML('beforeend', `<button class="reply-more" type="button" data-load-more-replies="${escapeHtml(reviewId)}" data-reply-paragraph="${escapeHtml(paragraphId)}" data-reply-page="${page + 1}">加载更多回复</button>`);
          } else if (loaded === 0) {
            container.innerHTML = '<div class="comment-state">暂无回复</div>';
          }
          container.dataset.loaded = '1';
        } catch (error) {
          if (isMore) { button.disabled = false; button.textContent = '重试加载回复'; }
          else container.innerHTML = `<div class="comment-state error">${escapeHtml(error.message)}</div>`;
        }
      }

      async function downloadCurrentBook() {
        const base = state.detail?.BaseBookInfo || {};
        const blackList = base.FreshManSimple?.IsInBlackList;
        if (blackList === undefined || blackList === null || Number(blackList) !== 0) return;
        if (!state.user) { showAuth('login', '您还未登录'); return; }
        const button = document.querySelector('[data-download-book]');
        if (!button) return;
        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = '正在生成';
        try {
          const response = await fetch(`download.php?book_id=${encodeURIComponent(base.BookId)}`, {
            headers: state.contentToken ? { 'X-Content-Token': state.contentToken } : {},
          });
          if (!response.ok) {
            let message = '下载失败';
            try { message = (await response.json()).detail || message; } catch (_) {}
            throw new Error(message);
          }
          const blob = await response.blob();
          const disposition = response.headers.get('Content-Disposition') || '';
          const encodedName = disposition.match(/filename\*=UTF-8''([^;]+)/i)?.[1];
          let filename = `${base.BookName || '起点作品'}.txt`;
          if (encodedName) { try { filename = decodeURIComponent(encodedName); } catch (_) {} }
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = filename;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          button.textContent = '下载完成';
          setTimeout(() => { if (button.isConnected) button.textContent = originalText; }, 1500);
        } catch (error) {
          button.textContent = '下载失败';
          setConnection(false, error.message || '下载失败');
          setTimeout(() => { if (button.isConnected) button.textContent = originalText; }, 1800);
        } finally {
          button.disabled = false;
        }
      }

      async function toggleCurrentShelfBook() {
        if (!state.user) {
          state.authNextView = 'toggle-shelf';
          showAuth('login', '请先登录后使用书架');
          return;
        }
        const base = state.detail?.BaseBookInfo || {};
        const bookId = String(base.BookId || state.catalog?.BookId || '');
        if (!bookId) return;
        const button = document.querySelector('[data-toggle-shelf]');
        if (button) { button.disabled = true; button.textContent = '正在保存'; }
        try {
          if (state.currentBookInShelf) {
            await bookshelfRequest('remove', { book_id: bookId });
            state.bookshelf = state.bookshelf.filter((book) => String(book.book_id) !== bookId);
            state.currentBookInShelf = false;
          } else {
            await bookshelfRequest('add', {
              book_id: bookId,
              book_name: base.BookName || state.catalog?.BookName || '未命名作品',
              author: state.detail?.AuthorInfo?.Author || state.catalog?.Author || '',
              description: base.Description || '',
              category: [base.CategoryName, base.SubCategoryName].filter(Boolean).join(' · '),
              words_count: Number(base.WordsCnt || 0),
              book_status: base.BookStatus || '',
            });
            state.currentBookInShelf = true;
          }
          state.bookshelfLoaded = false;
          renderBookDetail();
          setConnection(true, state.currentBookInShelf ? '已加入书架' : '已移出书架');
        } catch (error) {
          if (button) { button.disabled = false; button.textContent = state.currentBookInShelf ? '移出书架' : '加入书架'; }
          setConnection(false, error.message);
        }

      function fillSelect(select, options, emptyLabel = null) {
        const rows = emptyLabel === null ? [] : [{ Id: '', Name: emptyLabel }];
        select.innerHTML = rows.concat(options || []).map((item) =>
          `<option value="${escapeHtml(item.Id)}">${escapeHtml(item.Name)}</option>`
        ).join('');
      }

      function line(tag) {
        return (state.config?.FiltrLines || []).find((item) => item.Tag === tag);
      }

      function configureFields() {
        fillSelect(controls.order, state.config.Orders || []);
        [
          ['categoryid', controls.category], ['actionstatus', controls.actionstatus],
          ['wordscount', controls.wordscount], ['paidmode', controls.paidmode],
        ].forEach(([tag, target]) => {
          const options = line(tag)?.FilterUnions || [];
          fillSelect(target, options, tag === 'categoryid' ? null : '不限');
        });
        updateSubcategories();
        configureTagGroups();
        const availableSingles = new Set((state.config.FilterOne || []).map((item) => item.Tag));
        $('great').closest('label').hidden = !availableSingles.has('great');
        $('endure').closest('label').hidden = !availableSingles.has('endure');
      }

      function updateSubcategories() {
        const category = (line('categoryid')?.FilterUnions || []).find((item) => String(item.Id) === controls.category.value);
        const options = category?.Extvalue || [];
        fillSelect(controls.subcategory, options, '全部小分类');
        controls.subcategory.disabled = options.length === 0;
      }

      function tagGroups() {
        const groups = line('classid')?.FilterUnions || [];
        const popular = line('classid')?.PreFilterUnions || [];
        return (popular.length ? [{ Id: 'popular', Name: '热门标签', Extvalue: popular }] : []).concat(groups);
      }

      function configureTagGroups() {
        fillSelect($('tagGroup'), tagGroups());
        renderTags();
      }

      function renderTags() {
        const group = tagGroups().find((item) => String(item.Id) === $('tagGroup').value);
        const keyword = $('tagSearch').value.trim().toLowerCase();
        const tags = (group?.Extvalue || []).filter((tag) => !keyword || String(tag.Name).toLowerCase().includes(keyword));
        $('tagOptions').innerHTML = tags.length ? tags.map((tag) => {
          const id = String(tag.Id);
          return `<label class="tag-option" title="${escapeHtml(tag.Name)}"><input type="checkbox" value="${escapeHtml(id)}" ${state.selectedTags.has(id) ? 'checked' : ''}><span>${escapeHtml(tag.Name)}</span></label>`;
        }).join('') : '<span class="tag-empty">无匹配标签</span>';
      }

      async function loadConfig(siteId = '11') {
        setLoading(true, '正在加载配置');
        try {
          const response = await fetch(`${api}?action=config&site_id=${encodeURIComponent(siteId)}`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '配置加载失败');
          state.config = payload.Data;
          const currentSite = String(state.config.SiteType || siteId);
          fillSelect(controls.site, (state.config.SiteList || []).filter((site) => [11, 12].includes(Number(site.Id))));
          controls.site.value = currentSite;

          setConnection(true, '接口正常');

        } catch (error) {
          setConnection(false, '连接失败');
          showError(error.message);
        } finally {
          setLoading(false);
        }
