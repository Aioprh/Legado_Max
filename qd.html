      function queryParams() {
        const params = new URLSearchParams({
          action: 'ranking', site_id: controls.site.value, order: controls.order.value,
          page: String(state.page), page_size: String(state.pageSize), category_id: controls.category.value || '0',
        });
        const optional = [
          ['subcategory_id', controls.subcategory], ['action_status', controls.actionstatus],
          ['words_count', controls.wordscount], ['paid_mode', controls.paidmode],
        ];
        optional.forEach(([name, control]) => { if (control.value !== '') params.set(name, control.value); });
        if ($('great').checked) params.set('great', '1');
        if ($('endure').checked) params.set('endure', '1');
        if (state.selectedTags.size) {
          params.set('tag_type', form.elements.tag_type.value);
          params.set('tag_ids', Array.from(state.selectedTags.keys()).join('|'));
        }
        return params;
      }

      async function loadRanking() {
        setLoading(true, '正在查询榜单');
        try {
          const response = await fetch(`${api}?${queryParams()}`);
          const payload = await response.json();
          if (!response.ok || payload.Result !== 0) throw new Error(payload.detail || payload.Message || '榜单查询失败');
          renderResults(payload.Data || {});
          setConnection(true, '接口正常');
        } catch (error) {
          setConnection(false, '请求失败');
          showError(error.message);
        } finally {
          setLoading(false);
        }
      }

      function renderResults(data) {
        const books = data.Books || [];
        const total = Number(data.TotalCount || 0);
        state.totalPages = Math.min(50, Math.max(1, Math.ceil(total / state.pageSize)));
        const orderName = controls.order.options[controls.order.selectedIndex]?.text || '榜单';
        $('resultTitle').textContent = orderName;
        $('resultMeta').textContent = `${total.toLocaleString('zh-CN')} 本作品 · 本页 ${books.length} 本`;
        $('pageInput').max = String(state.totalPages);
        $('pageInput').value = String(state.page);
        $('pageTotal').textContent = `/ ${state.totalPages}`;
        $('prevPage').disabled = state.page <= 1;
        $('nextPage').disabled = state.page >= state.totalPages || books.length < state.pageSize;
        renderActiveFilters();
        if (!books.length) {
          $('results').innerHTML = '<div class="empty">当前条件下没有作品</div>';
          return;
        }
        $('results').innerHTML = books.map((book, index) => {
          const id = escapeHtml(book.BookId);
          const name = escapeHtml(book.BookName || '未命名作品');
          const category = [book.CategoryName, book.SubCategoryName].filter(Boolean).map(escapeHtml).join(' · ');
          const status = escapeHtml(book.ActionStatusString || book.BookStatus || '');
          const words = Number(book.WordsCount || 0);
          const cover = `https://bookcover.yuewen.com/qdbimg/349573/${encodeURIComponent(book.BookId)}/180`;
          return `<article class="book" data-book-id="${id}" role="button" tabindex="0">
            <div class="rank">${(state.page - 1) * state.pageSize + index + 1}</div>
            <div class="cover-wrap"><div class="cover-fallback">${name.slice(0, 4)}</div><img class="cover" src="${cover}" alt="${name}封面" loading="lazy" onerror="this.style.display='none'"></div>
            <div class="book-main"><h3 class="book-name">${name}</h3><div class="byline">${escapeHtml(book.AuthorName || '未知作者')}</div><p class="description">${escapeHtml(book.Description || book.Desc || '暂无简介')}</p></div>
            <div class="book-side"><div class="category">${category || '未分类'}</div><div class="stats">${words ? `${formatWords(words)}字` : ''}${status ? `<span class="state">${status}</span>` : ''}</div><div class="stats">ID ${id}</div></div>
          </article>`;
        }).join('');
      }

      function renderActiveFilters() {
        const labels = [];
        [controls.category, controls.subcategory, controls.actionstatus, controls.wordscount, controls.paidmode].forEach((control) => {
          if (!control.disabled && control.value !== '' && control.value !== '0') labels.push(control.options[control.selectedIndex]?.text);
        });
        if ($('great').checked) labels.push('精品');
        if ($('endure').checked) labels.push('耐看');
        state.selectedTags.forEach((name) => labels.push(name));
        $('activeFilters').innerHTML = labels.map((label) => `<span class="filter-chip">${escapeHtml(label)}</span>`).join('');
      }

      function formatWords(value) {
        if (value >= 10000) return `${(value / 10000).toFixed(value >= 100000 ? 0 : 1)}万`;
        return value.toLocaleString('zh-CN');
      }

      function setLoading(active, text = '') {
        state.loading = active;
        $('submitButton').disabled = active;
        $('prevPage').disabled = active || state.page <= 1;
        $('nextPage').disabled = active || state.page >= state.totalPages;
        $('pageInput').disabled = active;
        $('goPage').disabled = active;
        document.querySelectorAll('[data-page-step]').forEach((button) => { button.disabled = active; });
        if (active) $('results').innerHTML = `<div class="loading"><div><div class="spinner"></div>${escapeHtml(text)}</div></div>`;
      }

      function showError(message) {
        $('results').innerHTML = `<div class="error">${escapeHtml(message || '请求失败')}</div>`;
        $('resultMeta').textContent = '未获取到数据';
      }

      function resetRankingPage() {
        state.page = 1;
        $('pageInput').value = '1';
      }
      form.addEventListener('submit', (event) => { event.preventDefault(); setMobileFilters(false); resetRankingPage(); loadRanking(); });
      controls.site.addEventListener('change', () => { resetRankingPage(); loadConfig(controls.site.value); });
      controls.category.addEventListener('change', () => { resetRankingPage(); updateSubcategories(); });
      [controls.order, controls.subcategory, controls.actionstatus, controls.wordscount, controls.paidmode].forEach((control) => {
        control.addEventListener('change', resetRankingPage);
      });
      document.querySelectorAll('input[name="tag_type"], #great, #endure').forEach((control) => control.addEventListener('change', resetRankingPage));
      $('tagGroup').addEventListener('change', renderTags);
      $('tagSearch').addEventListener('input', renderTags);
      $('tagOptions').addEventListener('change', (event) => {
        if (!(event.target instanceof HTMLInputElement)) return;
        const label = event.target.nextElementSibling?.textContent || event.target.value;
        if (event.target.checked) state.selectedTags.set(event.target.value, label);
        else state.selectedTags.delete(event.target.value);
        resetRankingPage();
      });
      $('prevPage').addEventListener('click', () => { if (!state.loading && state.page > 1) { state.page--; loadRanking(); } });
      $('nextPage').addEventListener('click', () => { if (!state.loading && state.page < state.totalPages) { state.page++; loadRanking(); } });
      function jumpToRankingPage() {
        if (state.loading) return;
        const requested = Number.parseInt($('pageInput').value, 10);
        const page = Math.min(state.totalPages, Math.max(1, Number.isFinite(requested) ? requested : state.page));
        $('pageInput').value = String(page);
        if (page === state.page) return;
        state.page = page;
        loadRanking();
      }
      function stepRankingPage(delta) {
        const current = Number.parseInt($('pageInput').value, 10);
        const base = Number.isFinite(current) ? current : state.page;
        $('pageInput').value = String(Math.min(state.totalPages, Math.max(1, base + delta)));
      }
      document.querySelector('.page-stepper').addEventListener('click', (event) => {
        const button = event.target.closest('[data-page-step]');
        if (button) stepRankingPage(Number(button.dataset.pageStep));
      });
      $('goPage').addEventListener('click', jumpToRankingPage);
      $('pageInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); jumpToRankingPage(); }
        else if (event.key === 'ArrowUp') { event.preventDefault(); stepRankingPage(-1); }
        else if (event.key === 'ArrowDown') { event.preventDefault(); stepRankingPage(1); }
      });
      $('resetButton').addEventListener('click', () => {
        const currentSite = controls.site.value;
        form.reset(); controls.site.value = currentSite;
        state.page = 1; state.selectedTags.clear(); configureFields(); loadRanking();
      });
      $('homeTab').addEventListener('click', () => navigateView('home'));
      $('rankingTab').addEventListener('click', () => navigateView('ranking'));
      $('searchTab').addEventListener('click', () => navigateView('search'));
      $('bookshelfTab').addEventListener('click', () => navigateView('bookshelf'));
      $('openMobileFilters').addEventListener('click', () => setMobileFilters(true));
      $('closeMobileFilters').addEventListener('click', () => setMobileFilters(false));
      $('mobileFilterOverlay').addEventListener('click', () => setMobileFilters(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') setMobileFilters(false);
        if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown'].includes(event.key) || event.target.matches('input, textarea, select')) return;
        const content = $('readerContent');
        if (!content || $('commentDialog').open || $('authDialog').open || $('userDialog').open) return;
        if (state.readerPageMode === 'vertical') {
          if (changingChapter) return;
          const indexes = Array.from(document.querySelectorAll('[data-flow-index]')).map((item) => Number(item.dataset.flowIndex)).filter(Number.isInteger);
          if (['ArrowUp', 'PageUp'].includes(event.key)) {
            const atTop = window.scrollY <= 3;
            const previous = indexes.length ? Math.min(...indexes) - 1 : state.currentChapter - 1;
            if (atTop && previous >= 0) { event.preventDefault(); lockChangingChapter(); openChapter(previous); }
          } else if (['ArrowDown', 'PageDown'].includes(event.key)) {
            const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 3;
            const next = indexes.length ? Math.max(...indexes) + 1 : state.currentChapter + 1;
            if (atBottom && next < state.chapters.length) { event.preventDefault(); lockChangingChapter(); openChapter(next); }
          }
          return;
        }
        event.preventDefault();
        const direction = ['ArrowLeft', 'PageUp'].includes(event.key) ? -1 : 1;
        turnReaderPage(direction);
      });
      document.querySelector('.site-switch').addEventListener('click', (event) => {
        const button = event.target.closest('[data-home-site]');
        if (button) loadHome(button.dataset.homeSite);
      });
      $('homeModules').addEventListener('click', (event) => {
        const more = event.target.closest('[data-list-id]');
        if (more) { loadHomeList(more.dataset.listId, more.dataset.listName); return; }
        const book = event.target.closest('[data-book-id]');
        if (book) openBook(book.dataset.bookId);
      });
      $('results').addEventListener('click', (event) => {
        const book = event.target.closest('[data-book-id]');
        if (book) openBook(book.dataset.bookId);
      });
      $('results').addEventListener('keydown', (event) => {
        if (!['Enter', ' '].includes(event.key)) return;
        const book = event.target.closest('[data-book-id]');
        if (book) { event.preventDefault(); openBook(book.dataset.bookId); }
      });
      $('searchForm').addEventListener('submit', (event) => { event.preventDefault(); runSearch(1); });
      $('searchKeyword').addEventListener('input', () => {
        if ($('searchKeyword').value.trim() !== '') return;
        state.searchKeyword = '';
        state.searchPage = 1;
        state.searchTotal = 0;
        state.searchBooks = [];
        if ((window.__QIDIAN_ENTRY__ || '') === 'search') history.replaceState(null, '', frontendUrl('search'));
        if (state.searchDiscovery) renderSearchDiscovery();
        else loadSearchDiscovery();
      });
      $('searchContent').addEventListener('click', (event) => {
        const book = event.target.closest('[data-book-id]');
        if (book) { openBook(book.dataset.bookId); return; }
        const searchWord = event.target.closest('[data-search-word]');
        if (searchWord) {
          $('searchKeyword').value = searchWord.dataset.searchWord;
          runSearch(1);
          return;
        }
        const pageButton = event.target.closest('[data-search-page]');
        if (pageButton && !pageButton.disabled) { runSearch(Number(pageButton.dataset.searchPage)); return; }
      });
      $('bookshelfSearch').addEventListener('input', renderBookshelf);
      $('bookshelfRefresh').addEventListener('click', () => loadBookshelf(true));
      $('bookshelfContent').addEventListener('click', (event) => {
        if (event.target.closest('[data-open-search]')) { navigateView('search'); return; }
        const resume = event.target.closest('[data-resume-book]');
        if (resume) { resumeShelfBook(resume.dataset.resumeBook, resume.dataset.resumeChapter); return; }
        const remove = event.target.closest('[data-remove-shelf]');
        if (remove) { removeShelfBook(remove.dataset.removeShelf); return; }
        const book = event.target.closest('[data-book-id]');
        if (book) openBook(book.dataset.bookId);
      });
      $('detailContent').addEventListener('click', (event) => {
        if (event.target.closest('[data-toggle-shelf]')) { toggleCurrentShelfBook(); return; }
        if (event.target.closest('[data-download-book]')) { downloadCurrentBook(); return; }
        const chapter = event.target.closest('[data-chapter-index]');
        if (chapter) { openChapter(Number(chapter.dataset.chapterIndex)); return; }
        if (event.target.closest('[data-more-chapters]')) { state.catalogLimit += 100; renderCatalog(); return; }
        const catalogSort = event.target.closest('[data-catalog-sort]');
        if (catalogSort) { state.catalogOrder = catalogSort.dataset.catalogSort; renderCatalog(); return; }
        if (event.target.closest('[data-catalog-expand]')) { state.catalogExpanded = !state.catalogExpanded; renderCatalog(); return; }
        const paragraphComment = event.target.closest('[data-open-paragraph]');
        if (paragraphComment) {
          const paragraphId = Number(paragraphComment.dataset.openParagraph);
          const datasetChapter = Number.parseInt(paragraphComment.dataset.commentChapter ?? '', 10);
          const sectionChapter = Number.parseInt(paragraphComment.closest('[data-flow-index]')?.dataset.flowIndex ?? '', 10);
          const chapterIndex = [datasetChapter, sectionChapter].find((value) => Number.isInteger(value) && value >= 0);
          openComments(paragraphId, chapterIndex ?? state.currentChapter);
          return;
        }
        if (event.target.closest('[data-chapter-comments]')) {
          openComments(null, state.currentChapter);
          return;
        }
        const readerTurn = event.target.closest('[data-reader-turn]');
        if (readerTurn && state.readerPageMode === 'horizontal') { turnReaderPage(Number(readerTurn.dataset.readerTurn)); return; }
        const pageModeButton = event.target.closest('[data-page-mode]');
        if (pageModeButton) {
          if ($('commentDialog').open) $('commentDialog').close();
          state.readerPageMode = state.readerPageMode === 'horizontal' ? 'vertical' : 'horizontal';
          savePreference('qidian-page-mode', state.readerPageMode);
          const chapter = state.chapters[state.currentChapter];
          if (chapter) {
            verticalChapterLanding = 'top';
            loadChapter(state.currentChapter);
          } else {
            const content = $('readerContent');
            if (content) {
              const article = content.closest('.reader-article');
              const horizontal = state.readerPageMode === 'horizontal';
              content.classList.toggle('horizontal-pages', horizontal);
              content.classList.toggle('vertical-pages', !horizontal);
              if (article) article.classList.toggle('vertical-mode', !horizontal);
              content.scrollLeft = 0;
              pageModeButton.textContent = horizontal ? '⇅' : '⇄';
              pageModeButton.title = horizontal ? '切换为上下滚动' : '切换为左右翻页';
              setupReaderNavigation();
            }
          }
          return;
        }
        const reader = event.target.closest('[data-reader-index]');
        if (reader && !reader.disabled) { openChapter(Number(reader.dataset.readerIndex)); return; }
        const spacingButton = event.target.closest('[data-spacing]');
        if (spacingButton) {
          const values = ['tight', 'normal', 'wide'];
          state.readerSpacing = values[(values.indexOf(state.readerSpacing) + 1) % values.length];
          const content = $('readerContent');
          content.classList.remove('spacing-tight', 'spacing-normal', 'spacing-wide');
          content.classList.add(`spacing-${state.readerSpacing}`);
          const labels = { tight: '紧凑段距', normal: '标准段距', wide: '宽松段距' };
          spacingButton.title = labels[state.readerSpacing];
          savePreference('qidian-spacing', state.readerSpacing);
          return;
        }
        const fontButton = event.target.closest('[data-font]');
        if (fontButton) {
          const content = $('readerContent');
          state.readerFontSize = Math.min(26, Math.max(14, state.readerFontSize + Number(fontButton.dataset.font)));
          content.style.fontSize = `${state.readerFontSize}px`;
          savePreference('qidian-font-size', String(state.readerFontSize));
        }
      });
      $('detailContent').addEventListener('input', (event) => {
        if (event.target.id === 'chapterSearch') { state.catalogLimit = 100; renderCatalog(); }
      });
      $('accountButton').addEventListener('click', openAccount);
      document.querySelector('[data-close-auth]').addEventListener('click', () => $('authDialog').close());
      document.querySelector('[data-close-user]').addEventListener('click', () => $('userDialog').close());
      document.querySelector('.auth-tabs').addEventListener('click', (event) => {
        const tab = event.target.closest('[data-auth-tab]');
        if (tab) showAuth(tab.dataset.authTab);
      });
      $('authDialog').addEventListener('click', (event) => {
        const captcha = event.target.closest('[data-refresh-captcha]');
        if (captcha) refreshCaptcha(captcha.dataset.refreshCaptcha);
      });
      $('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = event.currentTarget.querySelector('[type="submit"]');
        button.disabled = true;
        setAuthMessage($('loginMessage'), '正在登录');
        try {
          const payload = await authRequest('login', {
            email: $('loginEmail').value.trim(), password: $('loginPassword').value,
            captcha_id: state.loginCaptchaId, captcha_answer: $('loginCaptcha').value.trim(),
          });
          state.user = payload.user;
          state.announcement = payload.announcement || state.announcement;
          updateAccountButton();
          $('authDialog').close();
          event.currentTarget.reset();
          await continueAfterAuth();
          await showAnnouncementIfNeeded();
        } catch (error) { setAuthMessage($('loginMessage'), error.message, true); refreshCaptcha('login'); }
        finally { button.disabled = false; }
      });
      $('sendCode').addEventListener('click', async () => {
        const email = $('registerEmail').value.trim();
        if (!email) { setAuthMessage($('registerMessage'), '请输入 QQ 邮箱', true); return; }
        const captchaAnswer = $('registerCaptcha').value.trim();
        if (!captchaAnswer) { setAuthMessage($('registerMessage'), '请先完成图片验证码', true); return; }
        const button = $('sendCode');
        button.disabled = true;
        setAuthMessage($('registerMessage'), '正在发送验证码');
        try {
          const payload = await authRequest('request-code', {
            email, captcha_id: state.registerCaptchaId, captcha_answer: captchaAnswer,
          });
          setAuthMessage($('registerMessage'), payload.message || '验证码已发送');
          refreshCaptcha('register');
          let remaining = 60;
          button.textContent = `${remaining} 秒后重发`;
          const timer = setInterval(() => {
            remaining -= 1;
            button.textContent = remaining > 0 ? `${remaining} 秒后重发` : '发送验证码';
            if (remaining <= 0) { clearInterval(timer); button.disabled = false; }
          }, 1000);
        } catch (error) {
          button.disabled = false;
          setAuthMessage($('registerMessage'), error.message, true);
          refreshCaptcha('register');
        }
      });
      $('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const buttons = event.currentTarget.querySelectorAll('button');
        buttons.forEach((button) => { button.disabled = true; });
        try {
          if (!state.registrationTicket) {
            const email = $('registerEmail').value.trim();
            const payload = await authRequest('verify-code', { email, code: $('registerCode').value.trim() });
            state.registrationTicket = payload.ticket;
            $('registerVerify').hidden = true;
            $('registerPasswordStep').hidden = false;
            $('registerPassword').disabled = false;
            $('registerPasswordConfirm').disabled = false;
            $('verifiedEmail').textContent = `${email} 已验证，请设置登录密码。`;
            setAuthMessage($('registerMessage'), '邮箱验证成功');
          } else {
            const password = $('registerPassword').value;
            if (password !== $('registerPasswordConfirm').value) throw new Error('两次输入的密码不一致');
            const payload = await authRequest('register', { ticket: state.registrationTicket, password });
            state.user = payload.user;
            state.announcement = payload.announcement || state.announcement;
            state.registrationTicket = '';
            updateAccountButton();
            $('authDialog').close();
            event.currentTarget.reset();
            $('registerVerify').hidden = false;
            $('registerPasswordStep').hidden = true;
            $('registerPassword').disabled = true;
            $('registerPasswordConfirm').disabled = true;
            await continueAfterAuth();
            await showAnnouncementIfNeeded();
          }
        } catch (error) { setAuthMessage($('registerMessage'), error.message, true); }
        finally { buttons.forEach((button) => { if (button.id !== 'sendCode' || button.textContent === '发送验证码') button.disabled = false; }); }
      });
      $('userPanel').addEventListener('submit', async (event) => {
        if (event.target.id !== 'passwordForm') return;
        event.preventDefault();
        const button = event.target.querySelector('[type="submit"]');
        button.disabled = true;
        try {
          const payload = await authRequest('change-password', { current_password: $('currentPassword').value, new_password: $('newPassword').value });
          setAuthMessage($('passwordMessage'), payload.message);
          state.user = null;
          state.contentToken = '';
          updateAccountButton();
          setTimeout(() => { $('userDialog').close(); showAuth('login', '密码已修改，请重新登录'); }, 600);
        } catch (error) { setAuthMessage($('passwordMessage'), error.message, true); }
        finally { button.disabled = false; }
      });
      $('userPanel').addEventListener('click', async (event) => {
        if (!event.target.closest('[data-logout]')) return;
        try { await authRequest('logout', {}); } catch (_) {}
        state.user = null;
        state.contentToken = '';
        state.bookshelf = [];
        state.bookshelfLoaded = false;
        updateAccountButton();
        $('userDialog').close();
        if (state.view === 'bookshelf') navigateView('home');
      });
      $('userPanel').addEventListener('change', async (event) => {
        if (!event.target.matches('input[name="preferredKey"]')) return;
        const inputs = Array.from(document.querySelectorAll('input[name="preferredKey"]'));
        inputs.forEach((input) => { input.disabled = true; });
        try {
          const payload = await authRequest('select-key', { key_id: Number(event.target.value) });
          state.user = payload.user;
          renderUserPanel();
          setAuthMessage($('credentialSelectionMessage'), '已切换凭据');
        } catch (error) {
          inputs.forEach((input) => { input.disabled = false; });
          setAuthMessage($('credentialSelectionMessage'), error.message, true);
        }
      });
      $('closeComments').addEventListener('click', () => $('commentDialog').close());
      $('commentDialog').addEventListener('close', () => {
        document.body.classList.remove('comment-open');
        state.commentParagraph = null;
        state.commentChapterIndex = -1;
        state.commentItems = [];
        state.commentPage = 1;
        state.commentTotal = 0;
        state.commentHasMore = false;
      });
      syncCommentViewport();
      window.addEventListener('resize', syncCommentViewport, { passive: true });
      window.visualViewport?.addEventListener('resize', syncCommentViewport, { passive: true });
      window.visualViewport?.addEventListener('scroll', syncCommentViewport, { passive: true });
      $('announcementConfirm').addEventListener('click', acknowledgeAnnouncement);
      $('commentMore').addEventListener('click', () => loadComments(false));
      $('commentTabs').addEventListener('click', (event) => {
        const tab = event.target.closest('[data-comment-type]');
        if (!tab || tab.dataset.commentType === state.commentType) return;
        state.commentType = tab.dataset.commentType;
        $('commentSort').hidden = state.commentType !== 'text';
        document.querySelectorAll('[data-comment-type]').forEach((item) => item.classList.toggle('active', item === tab));
        loadComments(true);
      });
      $('commentSort').addEventListener('change', () => {
        state.commentSort = Number($('commentSort').value);
        loadComments(true);
      });
      $('commentList').addEventListener('click', (event) => {
        const reply = event.target.closest('[data-load-replies], [data-load-more-replies]');
        if (reply) loadReplies(reply);
      });
      $('themeToggle').addEventListener('click', () => {
        state.theme = state.theme === 'night' ? 'day' : 'night';
        savePreference('qidian-theme', state.theme);
        applyPreferences();
      });

      async function bootstrapFrontend() {
        applyPreferences();
        await loadSession();
        await showAnnouncementIfNeeded();
        const params = new URLSearchParams(location.search);
        const inferred = ({
          'index.php':'home', 'home.php':'home', 'rank.php':'ranking', 'find.php':'search',
          'shelf.php':'bookshelf', 'book.php':'detail', 'read.php':'reader',
        })[location.pathname.split('/').pop()] || 'home';
        const entry = window.__QIDIAN_ENTRY__ || inferred;
        if (!window.__QIDIAN_ENTRY__ && location.pathname.endsWith('/ranking.html')) {
          history.replaceState(null, '', frontendUrl('home'));
        }
        document.title = ({
          home:'书城 · 起点阅读', ranking:'分类排行 · 起点阅读', search:'搜索 · 起点阅读',
          bookshelf:'我的书架 · 起点阅读', detail:'书籍详情 · 起点阅读', reader:'正文阅读 · 起点阅读',
        })[entry] || '起点阅读';
        const origin = params.get('origin');
        if (['home', 'ranking', 'search', 'bookshelf'].includes(origin)) state.detailOrigin = origin;

        if (entry === 'detail') {
          const bookId = params.get('book_id');
          if (bookId) await loadBook(bookId);
          else { showView('detail'); $('detailContent').innerHTML = '<div class="home-state error">缺少 book_id</div>'; }
          return;
        }
        if (entry === 'reader') {
          const bookId = params.get('book_id');
          const chapterId = params.get('chapter_id');
          if (bookId && chapterId) await loadBook(bookId, chapterId);
          else { showView('detail'); $('detailContent').innerHTML = '<div class="home-state error">缺少 book_id 或 chapter_id</div>'; }
          return;
        }
        if (entry === 'search') {
          const keyword = params.get('q') || '';
          const page = Math.max(1, Number(params.get('page') || 1));
          if (keyword) { $('searchKeyword').value = keyword; state.searchKeyword = keyword; }
          showView('search');
          if (keyword) await runSearch(page);
        } else {
          showView(entry);
        }
        if (params.get('auth') === 'login') showAuth('login', '登录状态已失效，请重新登录');
      }

      bootstrapFrontend();
    })();
  </script>
</body>
</html>
